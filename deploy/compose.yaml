# Hermes Starship · the boards, plus four read-only probes that keep live/ fresh: the rails probe
# (live/rails.json, and live/rail-log.json, when each rail went out or came back), the ship
# probe (live/orders.json, live/shiplog.json, live/records.json and live/yeoman.json, from Hermes'
# order log, Kanban cards and the Yeoman's files) and the Ops probe (live/nas.json, the NAS's own memory, CPU, temperature and disks).
# The meter probe (live/meters.json) gives the Science lab its spend, speed and leak meters; the
# speed-trial service, run by hand, times the local rail.
# nginx serves static files (about 10 MB of RAM). The probe is read-only towards Hermes and
# writes only deploy/live/. The one write path is the Yeoman's desk (below): board actions go
# into the Yeoman's inbox, and the Yeoman's own code applies them. No probe runs a model: the one Ollama call is GET /api/ps, and the one
# Anthropic call asks for the Claude usage (at most every 5 minutes).
# Settings for this NAS go in deploy/.env (git ignores it), see deploy/env.example.
services:
  starship:
    image: nginx:1.27-alpine
    container_name: hermes-starship
    restart: unless-stopped
    ports:
      - "8650:8080"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../fixtures:/srv/fixtures:ro
      - ./live:/srv/live:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./starship.htpasswd:/etc/nginx/starship.htpasswd:ro

  rails-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-rails
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    # Hermes' files belong to its own user (10000) and are private. This lets the probe read
    # them without being able to change anything; it writes only ./live, which it owns.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:?set OLLAMA_URL in deploy/.env}
      VRAM_GB: ${VRAM_GB:-24}
      CODEX_SESSIONS: /data/codex-sessions
      BURN_FILE: /data/burn.json
      # Claude: the sign-in Claude Code keeps for the ship's Claude stations, read-only. The probe
      # asks Anthropic for the 5 h and weekly use with it at most every CLAUDE_EVERY seconds.
      CLAUDE_SIGNIN: /data/claude/.credentials.json
      CLAUDE_EVERY: "300"
      # Codex: forge calls Codex through Hermes, which writes no Codex session logs, so the probe
      # asks OpenAI for the 5 h and weekly use (what Codex's /status shows) with the Codex sign-in
      # Hermes keeps in its auth.json, read-only, at most every CLAUDE_EVERY seconds. The logs stay
      # as the fallback.
      CODEX_SIGNIN: /data/hermes
      OUT_DIR: /out
      INTERVAL: "60"
    volumes:
      # Hermes keeps its data in /DATA/AppData/hermes (/opt/data inside Hermes). Read-only.
      - ${CODEX_SESSIONS_HOST:-/DATA/AppData/hermes/home/.codex/sessions}:/data/codex-sessions:ro
      - ${BURN_FILE_HOST:-/DATA/AppData/hermes/handoff/burn.json}:/data/burn.json:ro
      # The folder, not the file: when Claude Code renews the sign-in it replaces the file, and a
      # mount of the file alone would keep showing the old one.
      - ${CLAUDE_HOME_HOST:-/DATA/AppData/hermes/home/.claude}:/data/claude:ro
      # Hermes' folder for its auth.json files (the root one, each profile's, and the Codex CLI's).
      # The folder, not the files: Hermes replaces auth.json when it renews the sign-in. Read-only,
      # and the probe opens only the auth.json files in it.
      - ${HERMES_DATA_HOST:-/DATA/AppData/hermes}:/data/hermes:ro
      - ./live:/out
      - ../probe/rails_probe.py:/app/rails_probe.py:ro
    command: python -u /app/rails_probe.py

  # The ship probe: the real orders and the ship's log, from orders.csv, the Kanban cards and
  # handoff-log.csv. It reads Hermes' data folder read-only and has no network at all: it can't
  # reach anything, and nothing can reach it. It writes only ./live (what nginx serves) and its
  # own ./scratch (a copy of the Kanban database, which SQLite can't read in place read-only).
  ship-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-ship
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      ORDERS_CSV: /hermes/handoff/orders.csv
      KANBAN_DB: /hermes/kanban.db
      HANDOFF_LOG: /hermes/handoff/handoff-log.csv
      ANSWERS: /hermes/handoff/answers.jsonl
      ROSTER: /srv/fixtures/stations.json
      OUT_DIR: /out
      SCRATCH: /scratch
      INTERVAL: "60"
      DAYS: "7"
      RECORDS_KEEP: "1000"
      YEOMAN_DIR: /hermes/yeoman
      HELM_DIR: /hermes/helm/app-tracker
      FAST_PATHS: /hermes/routing/fast-paths.json
    volumes:
      - ${HERMES_DATA_HOST:-/DATA/AppData/hermes}:/hermes:ro
      - ../fixtures/stations.json:/srv/fixtures/stations.json:ro
      - ./live:/out
      - ./scratch:/scratch
      - ../probe/ship_probe.py:/app/ship_probe.py:ro
    command: python -u /app/ship_probe.py

  # The Ops probe: the NAS's own readings for the Ops board. It reads /proc and /sys (memory,
  # swap, CPU, uptime, temperature) and asks each disk below for its size, nothing more: no file
  # on a disk is opened or listed, and it sees none of Hermes' data. No network, no capabilities,
  # 32 MB of RAM. It writes only ./live/nas.json and its own disk history in ./scratch/ops.
  ops-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-ops
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Each disk: the path in here, its DK- id on the board, its name, and its mount on the NAS.
      # Add the backup disk in deploy/.env once its mount is known (see env.example).
      DISKS: ${OPS_DISKS:-/disks/1|DK-901|NAS data|/DATA;/disks/2|DK-903|NAS system|/}
      OUT_DIR: /out
      SCRATCH: /scratch
      INTERVAL: "60"
    volumes:
      # Any folder or file on a disk gives that disk's size. These are small, harmless ones.
      - ${DISK_1_HOST:-/DATA/AppData/hermes-starship}:/disks/1:ro
      - ${DISK_2_HOST:-/etc/os-release}:/disks/2:ro
      - ${DISK_3_HOST:-/etc/os-release}:/disks/3:ro
      - ./live:/out
      - ./scratch/ops:/scratch
      - ../probe/ops_probe.py:/app/ops_probe.py:ro
    command: python -u /app/ops_probe.py

  # The meter probe: the Science lab's meters. What the crew spends (tokens, and dollars where
  # Hermes has a price) by rail, station and window, from the number columns of Hermes' session
  # records (never a message or a prompt); each cloud rail's tokens a second, from the hand-off
  # log; the weekly leak share, from leak-kpis.csv; and the speed trials below. No network, no
  # capabilities but reading. It writes only ./live/meters.json, every 5 minutes.
  meter-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-meters
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      STATE_DBS: /hermes/state.db;/hermes/profiles/*/state.db
      HANDOFF_LOG: /hermes/handoff/handoff-log.csv
      LEAK_CSV: /hermes/handoff/rails/leak-kpis.csv
      TRIALS: /trials/speed-trials.json
      ROSTER: /srv/fixtures/stations.json
      OUT_DIR: /out
      INTERVAL: "300"
    volumes:
      - ${HERMES_DATA_HOST:-/DATA/AppData/hermes}:/hermes:ro
      - ../fixtures/stations.json:/srv/fixtures/stations.json:ro
      - ./scratch/trials:/trials:ro
      - ./live:/out
      - ../probe/meter_probe.py:/app/meter_probe.py:ro
    command: python -u /app/meter_probe.py

  # The holo probe: the Holodeck Officer's work on GitHub for the Review bay (live/holo.json).
  # GET only, to api.github.com, with a read-only sign-in for this one repo (GITHUB_READ in
  # deploy/.env). It sees none of Hermes' data and writes only ./live/holo.json. Without the
  # sign-in it writes nothing and the Review bay keeps its sample.
  holo-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-holo
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GITHUB_READ: ${GITHUB_READ:-}
      REPO: RogerHagman/Hermes-Starship
      HOLO_PATHS: /app/holo-paths.txt
      OUT_DIR: /out
      INTERVAL: "120"
      KEEP_DONE: "10"
      # The main watch flags commits on main since this time that came in without a merged PR.
      WATCH_FROM: "2026-11-07T21:00:00Z"
      # Commits you have looked at and cleared (comma-separated, short sha is fine), from deploy/.env.
      MAIN_OK: ${MAIN_OK:-}
    volumes:
      - ./live:/out
      - ../.github/holo-paths.txt:/app/holo-paths.txt:ro
      - ../probe/holo_probe.py:/app/holo_probe.py:ro
    command: python -u /app/holo_probe.py

  # The Yeoman's desk: the one way the Yeoman board can change the Captain's list. The board posts
  # one action (tick, cancel, reopen, important, due, edit, add, rank, snooze, arrived) to
  # /desk/action; the desk checks it and drops it as one JSON file in the Yeoman's inbox. It never
  # opens the Yeoman's CSV files: the Yeoman's own code applies the inbox on its timer (patch B2-45
  # in Hermes). It runs as the Yeoman's user (10000) and sees only yeoman/inbox/, read-write. No
  # ports: only nginx (the starship service) reaches it, on the compose network.
  # In the "desk" profile until the Yeoman patch has created yeoman/inbox/ (owned by 10000), so it
  # never starts by accident and Docker never creates the folder as root. Start it by name:
  #   sudo docker compose -f /DATA/AppData/hermes-starship/deploy/compose.yaml up -d yeoman-desk
  yeoman-desk:
    image: python:3.12-alpine
    profiles: [desk]
    container_name: hermes-starship-desk
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    user: "10000:10000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      INBOX: /inbox
      PORT: "8090"
    volumes:
      - type: bind
        source: ${HERMES_DATA_HOST:-/DATA/AppData/hermes}/yeoman/inbox
        target: /inbox
        bind:
          create_host_path: false
      - ../probe/yeoman_desk.py:/app/yeoman_desk.py:ro
    command: python -u /app/yeoman_desk.py

  # A speed trial on the local rail, run by hand (never on its own: it is in the "trial" profile):
  #   sudo docker compose -f deploy/compose.yaml run --rm speed-trial
  # The same short prompt three times to the model Ollama already has loaded: time to first token
  # and tokens a second. A few seconds of GPU time; it sees no Hermes data and writes only
  # ./scratch/trials, which the meter probe reads.
  speed-trial:
    image: python:3.12-alpine
    profiles: [trial]
    container_name: hermes-starship-trial
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:?set OLLAMA_URL in deploy/.env}
      MODEL: ${TRIAL_MODEL:-}
      REPEATS: "3"
      TOKENS: "128"
      TRIALS: /trials/speed-trials.json
    volumes:
      - ./scratch/trials:/trials
      - ../probe/speed_trial.py:/app/speed_trial.py:ro
    command: python -u /app/speed_trial.py
