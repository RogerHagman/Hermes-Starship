# Hermes Starship · the boards, plus three read-only probes that keep live/ fresh: the rails probe
# (live/rails.json, and live/rail-log.json, when each rail went out or came back), the ship
# probe (live/orders.json, live/shiplog.json and live/records.json, from Hermes' order log and
# Kanban cards) and the Ops probe (live/nas.json, the NAS's own memory, CPU, temperature and disks).
# nginx serves static files (about 10 MB of RAM). The probe is read-only towards Hermes and
# writes only deploy/live/. No model runs: its one Ollama call is GET /api/ps, and its one
# Anthropic call asks for the Claude usage (at most every 5 minutes).
# Settings for this NAS go in deploy/.env (git ignores it), see deploy/env.example.
services:
  starship:
    image: nginx:1.27-alpine
    container_name: hermes-starship
    restart: unless-stopped
    ports:
      - "8650:8080"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../fixtures:/srv/fixtures:ro
      - ./live:/srv/live:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./starship.htpasswd:/etc/nginx/starship.htpasswd:ro

  rails-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-rails
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    cap_drop: [ALL]
    # Hermes' files belong to its own user (10000) and are private. This lets the probe read
    # them without being able to change anything; it writes only ./live, which it owns.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      OLLAMA_URL: ${OLLAMA_URL:?set OLLAMA_URL in deploy/.env}
      VRAM_GB: ${VRAM_GB:-24}
      CODEX_SESSIONS: /data/codex-sessions
      BURN_FILE: /data/burn.json
      # Claude: the sign-in Claude Code keeps for the ship's Claude stations, read-only. The probe
      # asks Anthropic for the 5 h and weekly use with it at most every CLAUDE_EVERY seconds.
      CLAUDE_SIGNIN: /data/claude/.credentials.json
      CLAUDE_EVERY: "300"
      OUT_DIR: /out
      INTERVAL: "60"
    volumes:
      # Hermes keeps its data in /DATA/AppData/hermes (/opt/data inside Hermes). Read-only.
      - ${CODEX_SESSIONS_HOST:-/DATA/AppData/hermes/home/.codex/sessions}:/data/codex-sessions:ro
      - ${BURN_FILE_HOST:-/DATA/AppData/hermes/handoff/burn.json}:/data/burn.json:ro
      # The folder, not the file: when Claude Code renews the sign-in it replaces the file, and a
      # mount of the file alone would keep showing the old one.
      - ${CLAUDE_HOME_HOST:-/DATA/AppData/hermes/home/.claude}:/data/claude:ro
      - ./live:/out
      - ../probe/rails_probe.py:/app/rails_probe.py:ro
    command: python -u /app/rails_probe.py

  # The ship probe: the real orders and the ship's log, from orders.csv, the Kanban cards and
  # handoff-log.csv. It reads Hermes' data folder read-only and has no network at all: it can't
  # reach anything, and nothing can reach it. It writes only ./live (what nginx serves) and its
  # own ./scratch (a copy of the Kanban database, which SQLite can't read in place read-only).
  ship-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-ship
    restart: unless-stopped
    mem_limit: 64m
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      ORDERS_CSV: /hermes/handoff/orders.csv
      KANBAN_DB: /hermes/kanban.db
      HANDOFF_LOG: /hermes/handoff/handoff-log.csv
      ANSWERS: /hermes/handoff/answers.jsonl
      ROSTER: /srv/fixtures/stations.json
      OUT_DIR: /out
      SCRATCH: /scratch
      INTERVAL: "60"
      DAYS: "7"
      RECORDS_KEEP: "1000"
    volumes:
      - ${HERMES_DATA_HOST:-/DATA/AppData/hermes}:/hermes:ro
      - ../fixtures/stations.json:/srv/fixtures/stations.json:ro
      - ./live:/out
      - ./scratch:/scratch
      - ../probe/ship_probe.py:/app/ship_probe.py:ro
    command: python -u /app/ship_probe.py

  # The Ops probe: the NAS's own readings for the Ops board. It reads /proc and /sys (memory,
  # swap, CPU, uptime, temperature) and asks each disk below for its size, nothing more: no file
  # on a disk is opened or listed, and it sees none of Hermes' data. No network, no capabilities,
  # 32 MB of RAM. It writes only ./live/nas.json and its own disk history in ./scratch/ops.
  ops-probe:
    image: python:3.12-alpine
    container_name: hermes-starship-ops
    restart: unless-stopped
    mem_limit: 32m
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # Each disk: the path in here, its DK- id on the board, its name, and its mount on the NAS.
      # Add the backup disk in deploy/.env once its mount is known (see env.example).
      DISKS: ${OPS_DISKS:-/disks/1|DK-901|NAS data|/DATA;/disks/2|DK-903|NAS system|/}
      OUT_DIR: /out
      SCRATCH: /scratch
      INTERVAL: "60"
    volumes:
      # Any folder or file on a disk gives that disk's size. These are small, harmless ones.
      - ${DISK_1_HOST:-/DATA/AppData/hermes-starship}:/disks/1:ro
      - ${DISK_2_HOST:-/etc/os-release}:/disks/2:ro
      - ${DISK_3_HOST:-/etc/os-release}:/disks/3:ro
      - ./live:/out
      - ./scratch/ops:/scratch
      - ../probe/ops_probe.py:/app/ops_probe.py:ro
    command: python -u /app/ops_probe.py
