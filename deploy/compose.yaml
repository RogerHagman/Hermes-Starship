# Hermes Starship · the bridge landing page (Milestone 0, fixtures only).
# About 10 MB of RAM. Serves static files; no model, no backend, no writes.
services:
  starship:
    image: nginx:1.27-alpine
    container_name: hermes-starship
    restart: unless-stopped
    ports:
      - "8650:8080"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../fixtures:/srv/fixtures:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./starship.htpasswd:/etc/nginx/starship.htpasswd:ro
