# Hermes Starship · the demo: the boards on the sample data, no login, no live data, no Yeoman's desk.
# Used by compose.demo.yaml only. The real ship uses nginx.conf (behind a login, with live/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /fixtures/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /srv/fixtures/;
        add_header Cache-Control "no-store";
    }
    # No probes run in the demo, so every live file is missing and the boards keep their samples.
    location /live/ { return 404; }
    location /desk/ { return 404; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; script-src 'self'";
}
