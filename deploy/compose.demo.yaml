# Hermes Starship · the demo. The boards on the sample data in fixtures/, on this machine only.
# No Hermes, no probes, no login, nothing to fill in:
#   docker compose -f deploy/compose.demo.yaml up -d
# then open http://localhost:8650. Stop it with: docker compose -f deploy/compose.demo.yaml down
# It serves the committed build in frontend/dist, so Node is not needed. To wire the boards to a
# real Hermes, see the README ("Going live") and compose.yaml.
name: hermes-starship-demo
services:
  starship:
    image: nginx:1.27-alpine
    container_name: hermes-starship-demo
    restart: "no"
    ports:
      # This machine only. Change to "8650:8080" to reach it from your LAN.
      - "127.0.0.1:8650:8080"
    mem_limit: 64m
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../fixtures:/srv/fixtures:ro
      - ./nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
