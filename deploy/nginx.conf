# Hermes Starship · static landing page on the LAN, behind a login.
# Read-only: only GET and HEAD are answered, except POST /desk/action, which goes to the Yeoman's
# desk (the yeoman-desk service). The desk only drops actions into the Yeoman's inbox.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Hermes Starship";
    auth_basic_user_file /etc/nginx/starship.htpasswd;

    # The desk is looked up when asked (Docker's DNS), so nginx starts fine while it is not running;
    # the board then says the desk is offline.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /desk/ {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        client_max_body_size 8k;
        set $desk http://yeoman-desk:8090;
        proxy_pass $desk;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store";
    }
    location /fixtures/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /srv/fixtures/;
        add_header Cache-Control "no-store";
    }
    location /live/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        alias /srv/live/;
        add_header Cache-Control "no-store";
    }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; script-src 'self'";
}
